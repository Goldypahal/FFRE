[pytest]
testpaths = backend/tests benchmarks/third_party/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = backend .
addopts = -q
norecursedirs = scratch .venv backend/.venv dist node_modules frontend .git
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
