version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ffire_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ffire_user
      POSTGRES_PASSWORD: ffire_password
      POSTGRES_DB: ffire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffire_user -d ffire_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ffire_net

  redis:
    image: redis:7-alpine
    container_name: ffire_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ffire_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ffire_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ffire_user:ffire_password@db:5432/ffire_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=enterprise-production-secret-key-change-in-prod
      - ENCRYPTION_SECRET_KEY=gK4H7s2l0Y-X8n1Vq9m3Z_5bRt6yUo8pL2wE4rT6yU8=
      - ENV=production
      - RATE_LIMIT_ENABLED=true
      - CONFIDENCE_THRESHOLD=0.85
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ffire_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ffire_worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      - DATABASE_URL=postgresql://ffire_user:ffire_password@db:5432/ffire_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=enterprise-production-secret-key-change-in-prod
      - ENCRYPTION_SECRET_KEY=gK4H7s2l0Y-X8n1Vq9m3Z_5bRt6yUo8pL2wE4rT6yU8=
      - STRICT_ENTERPRISE_MODE=true
      - ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ffire_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ffire_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ffire_net

networks:
  ffire_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
