version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ffire_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ffire_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ffire_dev_insecure_password}
      POSTGRES_DB: ${POSTGRES_DB:-ffire_db}
    ports:
      - "${POSTGRES_PORT_BINDING:-127.0.0.1:5432:5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ffire_user} -d $${POSTGRES_DB:-ffire_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ffire_net

  redis:
    image: redis:7-alpine
    container_name: ffire_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_BINDING:-127.0.0.1:6379:6379}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ffire_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ffire_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Evidence files and the development signing key, shared with the worker and kept across restarts.
      - ffire_backend_data:/app/backend/data
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ffire_user}:${POSTGRES_PASSWORD:-ffire_dev_insecure_password}@db:5432/${POSTGRES_DB:-ffire_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-ffire-dev-secret-key-change-in-prod}
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY:-ffire-dev-encryption-key-change-in-prod}
      - ENV=${ENV:-development}
      # The worker service below runs the investigations; the API only queues them.
      - INVESTIGATION_EXECUTION=${INVESTIGATION_EXECUTION:-worker}
      # nginx in the frontend container is the one proxy in front of the API.
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-1}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.85}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ffire_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ffire_worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    volumes:
      - ffire_backend_data:/app/backend/data
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ffire_user}:${POSTGRES_PASSWORD:-ffire_dev_insecure_password}@db:5432/${POSTGRES_DB:-ffire_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-ffire-dev-secret-key-change-in-prod}
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY:-ffire-dev-encryption-key-change-in-prod}
      # Same default as the backend. Strict mode rejects the development secrets above, so
      # defaulting it to true here made this container exit on start. Turn it on, with real
      # secrets, for both services together.
      - STRICT_ENTERPRISE_MODE=${STRICT_ENTERPRISE_MODE:-false}
      - ENV=${ENV:-development}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ffire_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ffire_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ffire_net

networks:
  ffire_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ffire_backend_data:
    driver: local
