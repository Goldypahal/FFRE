version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ffire_user
      POSTGRES_PASSWORD: ffire_password
      POSTGRES_DB: ffire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  vector_db:
    image: milvusdb/milvus:v2.3.0
    # simplified for POC, in production use proper vector db like Milvus, Qdrant or pgvector
    ports:
      - "19530:19530"

volumes:
  postgres_data:
  redis_data:
