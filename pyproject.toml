[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffire-bench"
version = "0.1.0"
description = "Financial Fraud Investigation Reasoning & Evidence Benchmark (FFIRE-Bench)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "FFIRE-Bench Consortium", email = "benchmark@ffire.dev" }
]
keywords = ["nlp", "evaluation", "grounding", "fact-verification", "anti-money-laundering", "fraud-detection"]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0"
]

[project.scripts]
ffire-bench = "ffire_bench.cli:main"

[tool.setuptools.packages.find]
include = ["ffire_bench*"]
