apiVersion: v1
kind: ConfigMap
metadata:
  name: ffre-config
  labels:
    app.kubernetes.io/name: ffre
    app.kubernetes.io/component: config
data:
  ENV: "production"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  CONFIDENCE_THRESHOLD: "0.85"
  MAX_RETRIES: "3"
  STRICT_ENTERPRISE_MODE: "true"
  METRICS_ENABLED: "true"
  # The worker deployment runs investigations; the gateway only queues them.
  INVESTIGATION_EXECUTION: "worker"
  # Number of reverse proxies (the ingress controller) between clients and the gateway.
  TRUSTED_PROXY_COUNT: "1"
  # Per-process pools. Size them so (gateway replicas x workers + worker replicas) x
  # (DB_POOL_SIZE + DB_MAX_OVERFLOW + CHECKPOINT_POOL_MAX) stays under PostgreSQL's max_connections.
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "5"
  CHECKPOINT_POOL_MAX: "10"
