apiVersion: v1
kind: Secret
metadata:
  name: ffre-secrets
  labels:
    app.kubernetes.io/name: ffre
    app.kubernetes.io/component: secrets
type: Opaque
# NOTE: Do NOT commit production secrets to version control.
# This file is a template: kubectl does not expand ${VAR:-default}. Render it first, for example
#   envsubst < k8s/secrets.yaml | kubectl apply -f -
# or supply the same keys through sealed-secrets or the external-secrets operator.
# The application refuses to start in production while any value still begins with "REPLACE_".
stringData:
  DATABASE_URL: "${DATABASE_URL:-postgresql://ffre_user:REPLACE_WITH_SECURE_POSTGRES_PASSWORD@ffre-postgresql:5432/ffre_production}"
  CHECKPOINT_DB_URL: "${CHECKPOINT_DB_URL:-postgresql://ffre_user:REPLACE_WITH_SECURE_POSTGRES_PASSWORD@ffre-postgresql:5432/ffre_checkpoints}"
  REDIS_URL: "${REDIS_URL:-redis://:REPLACE_WITH_SECURE_REDIS_AUTH@ffre-redis:6379/0}"
  # The application reads SECRET_KEY (it signs the login tokens). It was named JWT_SECRET_KEY here,
  # which the code never reads, so the pods exited at start-up.
  SECRET_KEY: "${SECRET_KEY:-REPLACE_WITH_SECURE_JWT_SECRET_KEY}"
  # Ed25519 private key (PEM, PKCS8) that signs attestations and replay snapshots. Required in production.
  VERIFIER_PRIVATE_KEY_PEM: "${VERIFIER_PRIVATE_KEY_PEM:-REPLACE_WITH_ED25519_PRIVATE_KEY_PEM}"
  # One-time secret for creating the first (platform administrator) account.
  BOOTSTRAP_SECRET_KEY: "${BOOTSTRAP_SECRET_KEY:-REPLACE_WITH_SECURE_BOOTSTRAP_SECRET}"
  # Bearer token Prometheus must send to scrape /metrics.
  METRICS_TOKEN: "${METRICS_TOKEN:-REPLACE_WITH_SECURE_METRICS_TOKEN}"
  ENCRYPTION_SECRET_KEY: "${ENCRYPTION_SECRET_KEY:-REPLACE_WITH_SECURE_AES256_ENCRYPTION_KEY}"
  ENCRYPTION_SALT: "${ENCRYPTION_SALT:-REPLACE_WITH_SECURE_PBKDF2_SALT}"
