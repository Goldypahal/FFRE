name: FFRE Continuous Integration

on:
  push:
    branches: [ "main", "impl/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-qualification:
    name: Backend Test Suite & Migration Audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ffire_user
          POSTGRES_PASSWORD: ffire_password
          POSTGRES_DB: ffire_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ffire_user -d ffire_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-asyncio pytest-cov

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://ffire_user:ffire_password@localhost:5433/ffire_db
          POSTGRES_URL: postgresql://ffire_user:ffire_password@localhost:5433/ffire_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          PYTHONPATH: backend:.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          pytest backend/tests -v --maxfail=1

      - name: Run SRS Audit Verification
        env:
          PYTHONPATH: backend:.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/srs_audit_engine.py

  infra-resilience:
    name: Infra Resilience (Container Restarts) & PostgreSQL Load Benchmark
    runs-on: ubuntu-latest
    # Plain `docker run` containers (not job services) so they have fixed names that the
    # chaos tests can restart / stop / start: ffire_test_postgres and ffire_test_redis.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start PostgreSQL and Redis containers
        run: |
          docker run -d --name ffire_test_postgres \
            -e POSTGRES_USER=ffire_user -e POSTGRES_PASSWORD=ffire_password -e POSTGRES_DB=ffire_db \
            -p 5433:5432 postgres:16-alpine
          docker run -d --name ffire_test_redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 60); do
            if docker exec ffire_test_postgres pg_isready -U ffire_user -d ffire_db \
               && docker exec ffire_test_redis redis-cli ping | grep -q PONG; then
              echo "Containers ready"; exit 0
            fi
            sleep 2
          done
          echo "Containers did not become ready"; docker logs ffire_test_postgres; exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-asyncio

      - name: Run Container Restart / Outage Tests
        env:
          DATABASE_URL: postgresql://ffire_user:ffire_password@localhost:5433/ffire_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          PYTHONPATH: backend:.
          OMP_NUM_THREADS: "1"
        run: |
          set -o pipefail
          # -rs lists skips; the grep fails the step if any infra test was skipped instead of run.
          pytest backend/tests/test_live_container_chaos_recovery.py \
                 backend/tests/test_real_infra_recovery_and_security.py -v -rs | tee infra-tests.log
          if grep -q "SKIPPED" infra-tests.log; then echo "Infra tests were skipped; containers not detected"; exit 1; fi

      - name: Run PostgreSQL Load Benchmark
        env:
          DATABASE_URL: postgresql://ffire_user:ffire_password@localhost:5433/ffire_db
          ENVIRONMENT: test
          PYTHONPATH: backend:.
          OMP_NUM_THREADS: "1"
        run: |
          python benchmarks/pg_load_benchmark.py --workers 16 --duration 30 \
            --max-error-rate 0 --output pg_load_benchmark.json

      - name: Upload Benchmark Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-load-benchmark
          path: |
            pg_load_benchmark.json
            infra-tests.log
          if-no-files-found: warn

      - name: Container Logs on Failure
        if: failure()
        run: |
          docker logs ffire_test_postgres || true
          docker logs ffire_test_redis || true

  frontend-qualification:
    name: Frontend Build & E2E Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Unit Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        working-directory: frontend
        run: npx playwright test -g "Journey|Auth Security|Session Resilience|Queue Resilience|Cross-Tenant Boundary"
