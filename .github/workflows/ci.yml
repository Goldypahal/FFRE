name: FFRE Continuous Integration

on:
  push:
    branches: [ "main", "impl/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-qualification:
    name: Backend Test Suite & Migration Audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ffire_user
          POSTGRES_PASSWORD: ffire_password
          POSTGRES_DB: ffire_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ffire_user -d ffire_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-asyncio pytest-cov

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://ffire_user:ffire_password@localhost:5433/ffire_db
          POSTGRES_URL: postgresql://ffire_user:ffire_password@localhost:5433/ffire_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          PYTHONPATH: backend:.
        run: |
          pytest backend/tests -v --maxfail=1

      - name: Run SRS Audit Verification
        env:
          PYTHONPATH: backend:.
        run: |
          python scripts/srs_audit_engine.py

  frontend-qualification:
    name: Frontend Build & E2E Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Unit Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        working-directory: frontend
        run: npx playwright test -g "Journey|Auth Security|Session Resilience|Queue Resilience|Cross-Tenant Boundary"
